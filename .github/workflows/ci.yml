name: GoldApp CI

on:
  push:
    branches:
      - main
      - 'goldapp/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip, gd, dom, simplexml, xmlwriter, xmlreader, fileinfo, iconv, bcmath
          tools: composer

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 |
            xargs -0 -n1 php -l

      - name: Installer syntax check
        run: bash -n install.sh

      - name: Verify GoldApp source-of-truth
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GIT_REPO="zarkmakerburg/Goldapponline"' install.sh
          grep -q 'GOLDAPP_UPDATE_REPO="zarkmakerburg/Goldapponline"' install.sh
          grep -Fq 'raw.githubusercontent.com/${GOLDAPP_UPDATE_REPO}/${GOLDAPP_SELF_UPDATE_REF}/install.sh' install.sh
          if grep -q 'raw.githubusercontent.com/mahdiMGF2/mirzabot' install.sh; then
            echo "Installer still auto-updates from upstream" >&2
            exit 1
          fi
          grep -q '/usr/local/bin/goldapp' install.sh

      - name: Security regression checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '\$allow_insecure_panel_tls = false;' config.php
          grep -q '\$allow_legacy_api_bot_token = false;' config.php
          grep -q "HTTP_X_TELEGRAM_BOT_API_SECRET_TOKEN" function.php
          grep -q "'secret_token' =>" table.php
          ! grep -q 'index.php?secret=' table.php
          ! grep -q 'raw.githubusercontent.com/mahdiMGF2/mirzabot' install.sh
          for file in request.php wg_mate.php alireza_single.php ibsng/Modules/IBSng.php; do
            ! grep -E 'CURLOPT_SSL_(VERIFYHOST|VERIFYPEER).*(false|=> false)' "$file"
          done

      - name: Web security regression checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GOLDAPP_ADMIN_IDLE_TIMEOUT = 1800' panel/inc/config.php
          grep -q 'GOLDAPP_ADMIN_ABSOLUTE_TIMEOUT = 43200' panel/inc/config.php
          grep -q 'session_regenerate_id(true)' panel/inc/config.php
          grep -q 'X-Frame-Options: DENY' panel/inc/config.php
          grep -q 'Require all denied' panel/inc/.htaccess
          grep -q 'config\\.php|security\\.php' .htaccess
          grep -q 'hash\\.txt' api/.htaccess
          grep -q 'request body too large' api/utils.php
          grep -q 'token_expires_at' api/verify.php
          grep -q 'Token expired' api/miniapp.php
          ! grep -q 'dummy.hash.for.timing.attack.prevention' panel/login.php

      - name: Release safety regression checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GOLDAPP_UPDATE_REPO="zarkmakerburg/Goldapponline"' install.sh
          grep -q 'GOLDAPP_RELEASE_TAG_REGEX=' install.sh
          grep -q 'sha256sum' install.sh
          ! grep -q 'md5sum' install.sh
          grep -q 'sha256sum' .github/workflows/release.yml
          grep -q 'manifest' .github/workflows/release.yml
          grep -q 'RELEASE_VERSION' .github/workflows/release.yml
          test -f RELEASE_VERSION
          RELEASE_TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"
          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-goldapp\.[0-9]+$'
          RELEASE_CORE="${RELEASE_TAG#v}"
          RELEASE_CORE="${RELEASE_CORE%-goldapp.*}"
          test "$RELEASE_CORE" = "$(tr -d '[:space:]' < version)"

      - name: Dependency security audit
        run: composer audit --locked
