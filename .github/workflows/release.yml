name: GoldApp Online release

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GoldApp release tag to rebuild
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve release tag and commit
        id: release
        env:
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi

          COMMIT="$(git rev-parse HEAD)"
          CORE_VERSION="${TAG#v}"
          CORE_VERSION="${CORE_VERSION%-goldapp.*}"
          APP_VERSION="$(tr -d '[:space:]' < version)"

          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-goldapp\.[0-9]+$'
          test "$CORE_VERSION" = "$APP_VERSION"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip, gd, dom, simplexml, xmlwriter, xmlreader, fileinfo, iconv, bcmath
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative

      - name: Verify release inputs
        run: |
          set -euo pipefail
          test -f vendor/autoload.php
          bash -n install.sh
          php -l index.php

      - name: Build and verify assets
        id: assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          BUNDLE="goldapponline-host-${TAG}.zip"
          INSTALLER="goldapp-installer-${TAG}.sh"
          MANIFEST="goldapponline-release-${TAG}.manifest"

          zip -r -q "../${BUNDLE}" . \
            -x '.git/*' '.github/*' 'graphify-out/*' '.gitignore' 'install.sh'
          mv "../${BUNDLE}" .

          cp install.sh "${INSTALLER}"
          chmod 0755 "${INSTALLER}"

          unzip -t "${BUNDLE}"
          bash -n "${INSTALLER}"

          sha256sum "${BUNDLE}" > "${BUNDLE}.sha256"
          sha256sum "${INSTALLER}" > "${INSTALLER}.sha256"

          {
            echo "tag=${TAG}"
            echo "commit=${COMMIT}"
            echo
            cat "${BUNDLE}.sha256"
            cat "${INSTALLER}.sha256"
          } > "${MANIFEST}"

          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "bundle_checksum=${BUNDLE}.sha256" >> "$GITHUB_OUTPUT"
          echo "installer=${INSTALLER}" >> "$GITHUB_OUTPUT"
          echo "installer_checksum=${INSTALLER}.sha256" >> "$GITHUB_OUTPUT"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          if git rev-parse "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$TAG_COMMIT" != "$COMMIT" ]; then
              echo "Release tag ${TAG} already points to ${TAG_COMMIT}, expected ${COMMIT}" >&2
              exit 1
            fi
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$COMMIT" --title "$TAG" --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          BUNDLE: ${{ steps.assets.outputs.bundle }}
          BUNDLE_CHECKSUM: ${{ steps.assets.outputs.bundle_checksum }}
          INSTALLER: ${{ steps.assets.outputs.installer }}
          INSTALLER_CHECKSUM: ${{ steps.assets.outputs.installer_checksum }}
          MANIFEST: ${{ steps.assets.outputs.manifest }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$BUNDLE" "$BUNDLE_CHECKSUM" \
            "$INSTALLER" "$INSTALLER_CHECKSUM" \
            "$MANIFEST" \
            --clobber
