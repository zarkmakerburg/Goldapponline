name: GoldApp Online release bundle

on:
  push:
    tags:
      - 'v*-goldapp.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GoldApp release tag to build
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Validate GoldApp release tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-goldapp\.[0-9]+$'

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip, gd, dom, simplexml, xmlwriter, xmlreader, fileinfo, iconv, bcmath
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative

      - name: Verify release inputs
        run: |
          set -euo pipefail
          test -f vendor/autoload.php
          bash -n install.sh
          php -l index.php

      - name: Build and verify release assets
        id: bundle
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail

          BUNDLE="goldapponline-host-${TAG}.zip"
          INSTALLER="goldapp-installer.sh"
          MANIFEST="goldapponline-release-${TAG}.manifest"

          zip -r -q "../${BUNDLE}" . \
            -x '.git/*' '.github/*' 'graphify-out/*' '.gitignore' 'install.sh'
          mv "../${BUNDLE}" .

          cp install.sh "${INSTALLER}"
          chmod 0755 "${INSTALLER}"

          unzip -t "${BUNDLE}"
          bash -n "${INSTALLER}"

          sha256sum "${BUNDLE}" > "${BUNDLE}.sha256"
          sha256sum "${INSTALLER}" > "${INSTALLER}.sha256"

          {
            echo "tag=${TAG}"
            echo "commit=${GITHUB_SHA}"
            echo
            cat "${BUNDLE}.sha256"
            cat "${INSTALLER}.sha256"
          } > "${MANIFEST}"

          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "bundle_checksum=${BUNDLE}.sha256" >> "$GITHUB_OUTPUT"
          echo "installer=${INSTALLER}" >> "$GITHUB_OUTPUT"
          echo "installer_checksum=${INSTALLER}.sha256" >> "$GITHUB_OUTPUT"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
          BUNDLE_CHECKSUM: ${{ steps.bundle.outputs.bundle_checksum }}
          INSTALLER: ${{ steps.bundle.outputs.installer }}
          INSTALLER_CHECKSUM: ${{ steps.bundle.outputs.installer_checksum }}
          MANIFEST: ${{ steps.bundle.outputs.manifest }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            "$BUNDLE" "$BUNDLE_CHECKSUM" \
            "$INSTALLER" "$INSTALLER_CHECKSUM" \
            "$MANIFEST" \
            --clobber
