name: GoldApp Online release bundle

on:
  push:
    tags:
      - 'v*-goldapp.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build the hosting bundle for
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip, gd, dom, simplexml, xmlwriter, xmlreader, fileinfo, iconv, bcmath
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative

      - name: Verify autoloader
        run: test -f vendor/autoload.php

      - name: Validate GoldApp release tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-goldapp\.[0-9]+

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          FILE: ${{ steps.bundle.outputs.file }}
          CHECKSUM: ${{ steps.bundle.outputs.checksum }}
          MANIFEST: ${{ steps.bundle.outputs.manifest }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$FILE" "$CHECKSUM" "$MANIFEST" --clobber


      - name: Build and verify bundle
        id: bundle
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          FILE="goldapponline-host-${TAG}.zip"
          zip -r -q "../${FILE}" . -x '.git/*' '.github/*' 'graphify-out/*' '.gitignore' 'install.sh'
          mv "../${FILE}" .
          unzip -t "${FILE}"
          sha256sum "${FILE}" > "${FILE}.sha256"
          {
            echo "tag=${TAG}"
            echo "commit=${GITHUB_SHA}"
            echo "bundle=${FILE}"
            cat "${FILE}.sha256"
          } > "goldapponline-release-${TAG}.manifest"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${FILE}.sha256" >> "$GITHUB_OUTPUT"
          echo "manifest=goldapponline-release-${TAG}.manifest" >> "$GITHUB_OUTPUT"

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          FILE: ${{ steps.bundle.outputs.file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$FILE" --clobber
